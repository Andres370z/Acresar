<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card ">
                    <div class="card-header card-header-rose card-header-icon">
                        <div class="card-icon" style="background-color: #016672;">
                            <i class="material-icons">edit</i>
                        </div>
                        <h4 class="card-title">Editar Asociacion de contratos</h4>
                    </div>
                    <div class="card-body">
                        <form [formGroup]="form">
                            <div class="row">
                                <div class="col-12">
                                    <mat-form-field appearance="outline" class="full-width">
                                        <mat-label>Tipo de contrato</mat-label>
                                        <input matInput type="text" readonly placeholder="Tipo de Contrato"
                                            formControlName="tipoContrato">
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-12">
                                    <mat-form-field appearance="outline" class="full-width">
                                        <mat-label>ID Contrato</mat-label>
                                        <input matInput type="text" placeholder="ID Contrato"
                                            formControlName="idContrato">
                                    </mat-form-field>
                                    <input type="hidden" formControlName="idContratopk">


                                </div>
                            </div>

                            <div class="row">
                                <div class="col-12">
                                    <mat-form-field appearance="outline" class="full-width">
                                        <mat-label>Descripción Contrato</mat-label>
                                        <input matInput type="text" readonly placeholder="Descripción Contrato"
                                            formControlName="descripcion">
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-6">
                                    <mat-form-field appearance="outline" class="full-width">
                                        <mat-label>Inicio</mat-label>
                                        <input matInput type="text" readonly placeholder="Inicio"
                                            formControlName="fInicio">
                                    </mat-form-field>
                                </div>
                                <div class="col-6">
                                    <mat-form-field appearance="outline" class="full-width">
                                        <mat-label>Fin</mat-label>
                                        <input matInput type="text" readonly placeholder="Fin" formControlName="fFin">
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-12">
                                    <mat-form-field appearance="outline" class="full-width">
                                        <mat-label>Ramo</mat-label>
                                        <select matNativeControl formControlName="ramo" (change)="ShowAssoc(); getDetail();">
                                            <option *ngFor="let item of ramos" [value]="item.a">{{item.e}} - {{item.a2}}
                                            </option>
                                        </select>
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row" *ngIf="showAssoc">
                                <div class="col-12">
                                    <mat-form-field appearance="outline" class="full-width">
                                        <mat-label>Tipo de Asociación</mat-label>
                                        <select matNativeControl formControlName="tipoAsociacion"
                                            (change)="getDetail()">
                                            <option *ngFor="let item of tiposAsoc" [value]="item.a">{{item.c}}</option>
                                        </select>
                                    </mat-form-field>
                                </div>
                            </div>

                            <div class="row" *ngIf="showList">
                                <div class="col-2"></div>
                                <div class="col-8">
                                    <div class="form-group" *ngFor="let item of detail">
                                        <mat-checkbox (click)="detalle(item)">{{item.name}}</mat-checkbox>
                                    </div>
                                </div>
                                <div class="col-xs-2"></div>
                            </div>

                            <div class="row" *ngIf="listAsociacion.length > 0">
                                <div class="col-md-12">
                                    <table class="row-border hover">
                                        <thead>
                                            <tr>
                                                <th>Contrato</th>
                                                <th>Tipo Contrato</th>
                                                <th>Descripción</th>
                                                <th>Ramo</th>
                                                <th>Tipo de asociación</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr *ngFor="let i of listAsociacion">
                                                <td>{{i.idContrato}}</td>
                                                <td>{{i.tipoContrato}}</td>
                                                <td>{{i.descripcion}}</td>
                                                <td>{{i.ramoN}}</td>
                                                <td>{{i.tipoAs}}</td>
                                                <td>
                                                    <button mat-icon-button color="warn" (click)="delete(i)">
                                                        <mat-icon>delete</mat-icon>
                                                    </button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </form>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-default" (click)="agregar()">Agregar</button>
                            <button type="button" class="btn btn-primary" (click)="guardar()">Editar </button>
                            <button type="button" class="btn btn-primary" data-dismiss="modal"
                                id="cancelar">Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
