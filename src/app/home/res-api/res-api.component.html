<div class="body" id="particles-js">
  <div class="wrapper wrapper-full-page">
    <div class="page-header login-page header-filter" filter-color="black"
      style="background-image: url('../../../assets/img/lock.jpg'); background-size: cover; background-position: top center;">
      <!--   you can change the color of the filter page using: data-color="blue | purple | green | orange | red | rose " -->
      <div class="container">
        <div class="row">
          <div class="col-lg-6 col-md-8 col-sm-8 ml-auto mr-auto">
            <div class="card card-login card-hidden">
              <div class="card-header card-header-rose text-center" [style]="'background-color: black !important;'">
                <img class="img-login" src="./../../../assets/img/logo_login.png" alt="softsaenz">
                <h4 class="card-title">System Resolution</h4> 
              </div>
              <div class="center">
                <div class="col-12 text-center">
                  <a (click)="pruebas()" class="ov-btn-grow-skew-reverse">PRUEBAS</a>
                </div>
              </div>
              
              <div class="center">
                <div class="col-12 text-center">
                  <a (click)="produccion()"class="ov-btn-grow-skew-reverse">PRODUCCION</a>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</canvas>
